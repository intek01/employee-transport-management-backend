spring:
  application:
    name: employee-transport-management-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transport_db}
    username: ${DB_USERNAME:transport_user}
    password: ${DB_PASSWORD:transport_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
